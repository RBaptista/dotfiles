# Minimal Starship — plain text, cyan accent only, no powerline glyphs/icons.
format = """
$directory\
$git_branch\
$git_status\
$character"""

add_newline = false

[directory]
style = "bold #00FFFF"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "#7aa2f7"
format = "on [$branch]($style) "
symbol = ""

[git_status]
style = "#f7768e"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](bold #00FFFF)"
error_symbol = "[❯](bold #f7768e)"

[os]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[cmd_duration]
disabled = true

[package]
disabled = true
