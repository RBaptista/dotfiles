# ~/.config/hypr/monitors.conf

$main = eDP-1

# Laptop panel — port name is stable, keep as-is
monitor = $main, 1920x1080@120, 0x0, 1.5

# External monitor — match by description so it works regardless of port
monitor = desc:<run `hyprctl monitors all` to get this>, 1920x1080@60, 1280x0, 1

# Failsafe: anything else gets a sane default instead of failing silently
monitor = , preferred, auto, 1
